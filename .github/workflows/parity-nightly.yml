name: Parity (nightly refresh)

# The parity gate (TestParityBudgets) runs on every push as part of the normal
# `go test -race ./...` job in ci.yml, validating the committed
# bench/top30/top30_summary.json against docs/performance/parity_budgets.json.
#
# This workflow refreshes the numbers against Python Polars:
#   * parity-refresh   re-runs the top30 cross-language suite (light: 1K + 1M) to
#                      regenerate the summary, then re-runs the gate on the fresh
#                      ratios. Coverage now includes the migration-surface
#                      DataFrame methods (clone/drop/rename/is_empty/item/row/
#                      vstack/iter_rows/to_arrow/write_csv/write_parquet),
#                      tracked as out_of_scope until baselines are seeded.
#   * cross-filter-sum re-runs ./run-bench.sh --python at 1,000,000 elements:
#                      the filter+sum pipeline (all three Go execution paths) plus
#                      the primitive ops (sum/min/max/mean/minmax/add/mul) versus
#                      Python Polars, and uploads both comparison summaries.
# Neither commits; a real regression surfaces as a failing gate / a visible row in
# the comparison table, and a developer ratchets budgets after inspecting the diff.

on:
  schedule:
    - cron: '0 6 * * *' # daily 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  parity-refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          # ponytail: pinned — pyarrow 18.0.0 / polars 1.27.1 have no cp314 wheels,
          # and '3.x' now resolves to 3.14, forcing a failing source build. Bump
          # this with the pinned wheel availability in requirements-bench.txt.
          python-version: '3.12'

      - name: Install Python Polars
        run: python -m pip install -r bench/top30/requirements-bench.txt

      - name: Refresh top30 summary (Python + Go, light mode)
        # -light is a test-binary flag, so it must follow the package path.
        run: go test -run=NONE -bench=BenchmarkTop30 ./bench/top30/ -light

      - name: Enforce parity gate against fresh numbers
        run: go test -run TestParityBudgets ./bench/top30/

  cross-filter-sum:
    name: Cross filter+sum + primitives vs Polars (1M)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          # ponytail: pinned — see parity-refresh; '3.x' resolves to 3.14, no cp314 wheel.
          python-version: '3.12'

      - name: Install Python Polars
        run: python -m pip install -r bench/cross/requirements-bench.txt

      - name: Run filter+sum cross benchmark at 1M vs Polars
        # All three Go paths (eager / lazy / eager_direct) over both selectivity
        # profiles, at 1,000,000 elements only, compared against Python Polars.
        run: bash run-bench.sh --python -bench='BenchmarkCrossFilterSum/.+/.+/.+/size_1M$' -benchtime=2s -count=1

      - name: Run primitive ops cross benchmark at 1M vs Polars
        # The 7 SIMD primitives (sum/min/max/mean/minmax/add/mul) at 1,000,000
        # elements only, compared against Python Polars. ^...$ anchors the func
        # name so this does NOT also re-run BenchmarkCrossFilterSum.
        run: bash run-bench.sh --python -bench='^BenchmarkCross$/[a-z]+/size_1M$' -benchtime=2s -count=1

      - name: Upload comparison summaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cross-1m-summary
          path: |
            bench/cross/filter_sum_summary.json
            bench/cross/cross_summary.json
          if-no-files-found: warn
