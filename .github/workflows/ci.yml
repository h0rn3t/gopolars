name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goexperiment: ['', 'simd']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          # 1.27+ is required: pkg/simd's GOEXPERIMENT=simd kernels use the
          # portable stdlib `simd` package, whose vector-length-agnostic types
          # (and their arm64 backend) landed in Go 1.27.
          go-version: '1.27.x'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install ADBC SQLite driver (database IO integration tests)
        # The Go ecosystem has no native SQLite ADBC driver; the pip wheel bundles
        # the C driver, which the integration tests auto-discover via python3. If
        # this is absent the tests skip rather than fail.
        run: python -m pip install adbc-driver-sqlite

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: go vet
        env:
          GOEXPERIMENT: ${{ matrix.goexperiment }}
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          # v1.x binaries are built with Go <1.26 and cannot lint go 1.27 modules.
          version: v2.12.2
          # Lint the duckdb-tagged build view so the opt-in SQL engine
          # (sql_duckdb.go / sql_udf.go) is covered too. Build tags are additive, so
          # every pure-Go package is still linted; only the tiny !duckdb stub
          # (sql_stub.go) drops out of this view. CGO is needed to typecheck the
          # go-duckdb cgo files.
          args: --timeout=5m --build-tags=duckdb,duckdb_arrow
        env:
          GOEXPERIMENT: ${{ matrix.goexperiment }}
          CGO_ENABLED: '1'

      - name: go test -race (full suite, incl. opt-in DuckDB SQL)
        # Build tags are ADDITIVE, so this single step compiles and runs the WHOLE
        # suite in one go — the pure-Go packages plus the opt-in DuckDB SQL engine
        # and its py-polars parity corpus (CGO links a bundled DuckDB static lib).
        # The pure-Go build (without the tags) is still verified by `go vet ./...`
        # above, which keeps the opt-in guarantee that SQL never leaks into the
        # default build.
        env:
          GOEXPERIMENT: ${{ matrix.goexperiment }}
          CGO_ENABLED: '1'
        run: go test -race -tags "duckdb duckdb_arrow" ./...

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Unit test coverage
        run: |
          go test -race -coverprofile=coverage.out -covermode=atomic ./pkg/...

      - name: Coverage threshold gate
        # Fails the build if any pkg/... package drops below its per-package floor
        # (70%) or the combined total falls below 75%. See scripts/coverage.sh.
        run: make cover-enforce

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        # Coverage upload is best-effort: a Codecov uploader/infra failure (e.g.
        # the GPG signature-verification step failing to import the public key)
        # must not gate the build, since tests and lint already gate it.
        continue-on-error: true
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.out
          flags: unit
          name: gopolars-unit
          fail_ci_if_error: false
          verbose: true
